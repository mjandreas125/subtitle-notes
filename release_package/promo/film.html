<!doctype html>
<meta charset="utf-8" />
<title>Subtitle Notes - promo</title>
<!--
  The promo film, 1920x1080, as a seekable page.

      film.html?lang=en&t=13.2     one frame, exactly, in real seconds
      film.html?lang=ru            plays in the browser, for eyeballing

  Every animation is declared paused and seeked with a negative delay, so the
  frame at t is a pure function of t and nothing depends on wall-clock timing.
  That is what lets a headless renderer walk the timeline one frame at a time
  and get the same film every run.

  Times in this file are written in STORY seconds and played back at RATE.
  Both constants are shared with tools/promo-audio.py, and the cut follows the
  sound design that file already contains - the key at 9.45, three notes for
  three nodes at 14.1/14.75/15.4, the bell on the answer at 16.9, the swell for
  the three devices at 22.5, five notes for five languages from 27.5, the last
  bell at 31.9. Move a beat here and it goes out of sync with the music.

  THE SPACE. Everything lives in one perspective, and the camera never stops
  moving: the subtitle is a plane lying in front of the picture, the machine is
  a corridor of planes receding away from it, and the answer comes back out of
  that corridor towards the viewer. The camera is driven from seek(), not from
  a keyframe, because the canvas layer projects its motes with the same numbers
  - one space, not a 3D scene with a 2D overlay pasted on top.
-->
<script src="strings.js"></script>
<style>
  :root {
    --t: 0;                                  /* the clock, in real seconds */
    --ink:    #eef3f0;
    --dim:    #93a49c;
    --faint:  #6d7f77;
    --accent: #46d68f;
    --deep:   #05080a;
    --out:    cubic-bezier(.16, 1, .3, 1);   /* ease-out-expo */
    --quart:  cubic-bezier(.25, 1, .5, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--deep); overflow: hidden; }
  body {
    width: 1920px; height: 1080px; position: relative;
    font: 400 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
  }

  /* Every animated element carries this. The shorthand is never used inline,
     because the shorthand would reset the delay that does the seeking. */
  .a {
    animation-play-state: paused;
    animation-fill-mode: both;
    animation-delay: calc((var(--s, 0) - var(--t)) * 1s);
    animation-timing-function: var(--out);
  }
  @media (prefers-reduced-motion: reduce) {
    html:not([data-motion]) .a { animation: none !important; opacity: 1 !important; }
  }

  @keyframes fade      { from { opacity: 0 } to { opacity: 1 } }
  @keyframes out       { from { opacity: 1 } to { opacity: 0 } }
  @keyframes rise      { from { opacity: 0; transform: translateY(26px) } to { opacity: 1; transform: none } }
  @keyframes riseSmall { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
  @keyframes sink      { from { opacity: 1; transform: none } to { opacity: 0; transform: translateY(18px) } }
  @keyframes wipe      { from { clip-path: inset(0 100% 0 0) } to { clip-path: inset(0 0 0 0) } }
  @keyframes strike    { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  @keyframes press     { from { transform: translateZ(18px) } to { transform: translateZ(4px) } }

  /* Depth entrances. A plane arrives by coming forward out of the dark, which
     in one perspective is a different thing from growing in place. */
  @keyframes comeUp    { from { opacity: 0; transform: translate3d(0, 40px, -220px) } to { opacity: 1; transform: none } }
  @keyframes landHere  { from { opacity: 0; transform: translate3d(0, 0, -560px) scale(.92) } to { opacity: 1; transform: none } }
  @keyframes lift      { from { transform: translate3d(0, 0, 0) } to { transform: translate3d(0, -26px, 96px) } }
  @keyframes recede    { from { opacity: 1; transform: translateZ(0) } to { opacity: .16; transform: translateZ(-460px) } }
  @keyframes sheen     { from { transform: translateX(-120%) skewX(-18deg) } to { transform: translateX(320%) skewX(-18deg) } }
  @keyframes ring      { from { opacity: .55; transform: scale(.35) } to { opacity: 0; transform: scale(1.9) } }
  @keyframes chipIn    { from { opacity: 0; transform: translate3d(0, 14px, -60px) } to { opacity: 1; transform: none } }

  /* — the space — */
  #world { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 50% 45%; }
  #cam { position: absolute; inset: 0; transform-style: preserve-3d; }
  .plane {
    position: absolute; left: 50%; top: 45%;
    transform-style: preserve-3d;
    will-change: transform, opacity;
  }

  /* — the room behind the picture — */
  #room { width: 2600px; height: 1500px; margin: -750px 0 0 -1300px; }
  .lamp {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 236, 190, .5), rgba(255, 236, 190, 0) 68%);
    filter: blur(14px);
  }
  #haze {
    position: absolute; inset: 0;
    background: radial-gradient(60% 55% at 50% 42%, rgba(24, 46, 40, .55), rgba(5, 8, 10, 0) 70%);
  }

  /* — the series, playing — */
  #screen {
    width: 1500px; height: 844px; margin: -470px 0 0 -750px;
    border-radius: 14px; overflow: hidden;
    background:
      radial-gradient(42% 56% at 24% 30%, rgba(70, 214, 143, .30), rgba(0, 0, 0, 0) 66%),
      radial-gradient(46% 58% at 76% 26%, rgba(150, 186, 255, .20), rgba(0, 0, 0, 0) 64%),
      radial-gradient(70% 80% at 50% 92%, rgba(255, 226, 178, .10), rgba(0, 0, 0, 0) 70%),
      linear-gradient(#16211f, #0a1113);
    box-shadow: 0 60px 140px -60px rgba(0, 0, 0, .9), inset 0 0 120px rgba(0, 0, 0, .7);
  }
  #scan {
    position: absolute; inset: 0; opacity: .5;
    background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .022) 0 1px, rgba(0, 0, 0, 0) 1px 3px);
  }
  .figure {
    position: absolute; border-radius: 50% 50% 46% 46%;
    background: linear-gradient(#0c1417, #05090b);
  }
  #bar { position: absolute; left: 60px; right: 60px; bottom: 44px; height: 3px; background: rgba(238, 243, 240, .16); border-radius: 2px; }
  #bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 66%; background: var(--accent); border-radius: 2px; }
  #bar b { position: absolute; left: 66%; top: -4px; width: 11px; height: 11px; margin-left: -5px; border-radius: 50%; background: var(--accent); }
  .meta {
    position: absolute; bottom: 66px; font: 500 20px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .1em; color: var(--faint);
  }
  .meta.l { left: 60px; }
  .meta.r { right: 60px; font-variant-numeric: tabular-nums; }
  #paused {
    position: absolute; right: 60px; top: 52px;
    display: flex; align-items: center; gap: 12px;
    font: 600 20px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .22em; color: var(--ink);
  }
  #paused s { display: inline-block; width: 5px; height: 22px; background: var(--ink); }

  /* — the subtitle, a plane of its own lying in front of the picture — */
  #subs { width: 1400px; margin: 70px 0 0 -700px; transform: translateZ(120px) rotateX(-9deg); }
  .cap {
    display: inline-block; padding: 18px 30px; border-radius: 10px;
    background: rgba(5, 8, 10, .74);
    font: 600 54px/1.24 "Segoe UI", system-ui, sans-serif; letter-spacing: -.012em;
    white-space: nowrap;
  }
  .cap em { font-style: normal; position: relative; padding: 0 4px; }
  #hl {
    position: absolute; left: 0; right: 0; top: 2px; bottom: 2px;
    background: var(--accent); border-radius: 5px; z-index: -1;
  }
  .cap em.on { color: #06231a; }

  /* — the dictionary's flat, wrong answer — */
  #dict {
    width: 1000px; margin: 152px 0 0 -500px; transform: translateZ(80px);
    text-align: center;
  }
  #dict .lbl {
    font: 500 21px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .2em;
    text-transform: uppercase; color: var(--faint); margin-right: 18px;
  }
  #dict .val { display: inline-block; position: relative; font: 400 40px/1.2 "Segoe UI", system-ui, sans-serif; color: #bccac3; }
  #dict .val u { position: absolute; left: -8px; right: -8px; top: 52%; height: 4px; background: #e0736c; transform-origin: left center; text-decoration: none; }

  /* — the corridor: three nodes receding away — */
  .node { width: 460px; margin: -60px 0 0 -230px; text-align: center; }
  .node .dot {
    width: 30px; height: 30px; margin: 0 auto; border-radius: 50%;
    background: #d9fbea;
    box-shadow: 0 0 0 14px rgba(70, 214, 143, .16), 0 0 90px 10px rgba(70, 214, 143, .75);
  }
  .node .nm {
    margin-top: 22px; display: inline-block; padding: 10px 22px; border-radius: 999px;
    background: rgba(8, 26, 21, .9); border: 1px solid rgba(70, 214, 143, .5);
    font: 600 34px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .03em; color: var(--ink);
  }

  /* — the answer, coming back out at the viewer — */
  #card {
    width: 1020px; margin: -170px 0 0 -510px; padding: 40px 46px 44px;
    border-radius: 20px; overflow: hidden;
    background: linear-gradient(#111c19, #0a1210);
    border: 1px solid rgba(70, 214, 143, .3);
    box-shadow: 0 80px 160px -70px rgba(0, 0, 0, .95), 0 0 90px -30px rgba(70, 214, 143, .28);
    transform: translateZ(150px);
  }
  #card .src { font: 400 26px/1 "Segoe UI", system-ui, sans-serif; color: var(--faint); letter-spacing: .02em; }
  #card .lead { margin-top: 20px; font: 700 62px/1.14 "Segoe UI", system-ui, sans-serif; letter-spacing: -.026em; }
  #card .term { margin-top: 18px; font: 500 30px/1 "Segoe UI", system-ui, sans-serif; color: var(--accent); }
  #chips { margin-top: 26px; display: flex; gap: 14px; flex-wrap: wrap; }
  #chips span {
    padding: 12px 20px; border-radius: 999px;
    background: rgba(70, 214, 143, .1); border: 1px solid rgba(70, 214, 143, .22);
    font: 500 24px/1 "Segoe UI", system-ui, sans-serif; color: #a7e6c6;
  }
  #gloss { position: absolute; left: 46px; right: 46px; bottom: 44px; font: 400 26px/1.35 "Segoe UI", system-ui, sans-serif; color: var(--dim); }
  #shine {
    position: absolute; top: -20%; bottom: -20%; width: 34%;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .07), rgba(255, 255, 255, 0));
  }
  #halo {
    position: absolute; left: 50%; top: 50%; width: 1300px; height: 1300px; margin: -650px 0 0 -650px;
    border-radius: 50%; border: 2px solid rgba(70, 214, 143, .5);
  }

  /* — one library, three places — */
  .dev { width: 380px; margin: -190px 0 0 -190px; }
  .dev .glass {
    height: 250px; border-radius: 16px;
    background: linear-gradient(#0f1a17, #080f0d);
    border: 1px solid rgba(238, 243, 240, .1);
    box-shadow: 0 50px 90px -50px rgba(0, 0, 0, .9);
    position: relative; overflow: hidden;
  }
  .dev .glass i {
    position: absolute; left: 22px; right: 22px; height: 12px; border-radius: 6px;
    background: rgba(238, 243, 240, .13);
  }
  .dev .glass i.k { background: rgba(70, 214, 143, .5); }
  .dev .nm { margin-top: 22px; text-align: center; font: 600 30px/1 "Segoe UI", system-ui, sans-serif; color: var(--ink); letter-spacing: .04em; }

  /* — the same answer, language after language — */
  /* Sits exactly where the card's own answer sits, so the language changes
     inside the card instead of replacing it. */
  #swap { width: 1000px; margin: -66px 0 0 -500px; height: 88px; transform: translateZ(152px); }
  #swap div {
    position: absolute; left: 0; right: 0; text-align: center;
    font: 700 60px/1.1 "Segoe UI", system-ui, sans-serif; letter-spacing: -.026em;
  }

  /* — the caption plane: always square to the camera, always legible — */
  #says {
    position: absolute; left: 0; right: 0; bottom: 96px; text-align: center;
    font: 500 40px/1.3 "Segoe UI", system-ui, sans-serif; letter-spacing: -.012em;
  }
  #says div { position: absolute; left: 0; right: 0; }
  #says b { color: var(--accent); font-weight: 500; }

  /* — the end card — */
  #end { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  #mark {
    width: 132px; height: 100px; margin: 0 auto; border-radius: 26px;
    background: var(--accent); position: relative;
    box-shadow: 0 0 120px -20px rgba(70, 214, 143, .5);
  }
  #mark::before, #mark::after { content: ''; position: absolute; height: 13px; border-radius: 7px; background: #06231a; }
  #mark::before { top: 30px; left: 24px; right: 24px; }
  #mark::after { bottom: 30px; left: 24px; width: 34px; }
  #end h2 { margin-top: 40px; font: 750 86px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: -.038em; }
  #end p { margin-top: 20px; font: 400 32px/1 "Segoe UI", system-ui, sans-serif; color: var(--dim); }
  #end small { display: block; margin-top: 44px; font: 400 25px/1 "Segoe UI", system-ui, sans-serif; color: var(--faint); letter-spacing: .04em; }

  /* — the motes, the beams, the grain: one canvas over the whole space — */
  #fx { position: absolute; inset: 0; pointer-events: none; }
  #veil { position: absolute; inset: 0; background: var(--deep); opacity: 0; }
</style>

<div id="stage"></div>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') || 'en';
  const T = window.STRINGS[lang] || window.STRINGS.en;
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  if (q.has('t')) document.documentElement.dataset.motion = '1';

  const RATE = 0.75;
  const STORY_END = 36.6;

  const A = (name, start, dur, ease) =>
    `--s:${(start * RATE).toFixed(4)}; animation-name:${name};`
    + `animation-duration:${(dur * RATE).toFixed(4)}s;`
    + (ease ? `animation-timing-function:${ease};` : '');

  /* The beats, in story seconds, named after what the audio does at them. */
  const B = {
    open: 0.8, lineIn: 2.9, dictIn: 4.4, strike: 6.0, dictOut: 7.4,
    key: 9.45, drag: 9.8, held: 11.05, pause: 11.3,
    away: 13.0, n1: 14.1, n2: 14.75, n3: 15.4, back: 16.2, answer: 16.9, chips: 18.6,
    devSwell: 22.5, dev: 23.2, flow: 24.3,
    swaps: 27.5, endCard: 31.9,
  };

  const LAMPS = [[300,-560,-180,.5],[210,420,-330,.42],[420,760,120,.3],[170,-780,190,.34],[260,180,300,.26]]
    .map(([d, x, y, o]) => `<div class="lamp" style="width:${d}px;height:${d}px;left:${1300 + x}px;top:${750 + y}px;opacity:${o * 1.7}"></div>`).join('');

  const FIGURES = [[520,300,-200,470],[300,180,180,300]]
    .map(([w, h, x, y]) => `<div class="figure" style="width:${w}px;height:${h}px;left:${750 + x}px;top:${422 + y}px"></div>`).join('');

  const cap = (parts, on) => parts.map((p, i) =>
    i === 1 ? `<em${on ? ' class="on"' : ''}>${on ? '<span id="hl" class="a" style="' + A('wipe', B.drag, 1.25, 'var(--quart)') + '"></span>' : ''}${esc(p)}</em>` : esc(p)).join('');

  const NODE_AT = [[-380, 40, -150], [140, -30, -350], [-150, -110, -560]];
  const NODES = T.fnodes.map((name, i) =>
    `<div class="plane node" data-at="${i}">
       <div class="a" style="${A('landHere', [B.n1, B.n2, B.n3][i] - 0.4, 0.95)}">
         <div class="dot"></div><div class="nm">${esc(name)}</div>
       </div>
     </div>`).join('');

  const DEVS = T.s4dev.map((name, i) => {
    const rows = [0, 1, 2, 3].map((r) => `<i class="${r === 1 ? 'k' : ''}" style="top:${34 + r * 46}px;width:${[74, 58, 66, 46][r]}%"></i>`).join('');
    return `<div class="plane dev" data-dev="${i}">
              <div class="a" style="${A('comeUp', B.dev + i * 0.22, 1.0)}">
                <div class="glass">${rows}</div><div class="nm">${esc(name)}</div>
              </div>
            </div>`;
  }).join('');

  const SWAPS = T.fswaps.map((word, i) => {
    const at = B.swaps + i * 0.74;
    const last = i === T.fswaps.length - 1;
    return `<div class="a" style="${A('landHere', at, 0.5)}">
              <div class="a" style="${last ? A('fade', at, 0.01) : A('out', at + 0.6, 0.22)}">${esc(word)}</div>
            </div>`;
  }).join('');

  /* One sentence at a time: each is spoken until a beat before the next one,
     because two of them fading through each other is unreadable. */
  const LINES = [
    [T.f1, B.dictIn + 0.25],
    [T.f2, B.strike + 0.15],
    [T.f3, B.key - 0.8],
    [T.f4, B.n1 - 0.4],
    [T.f5, B.chips + 0.4],
    [T.f6, B.dev - 0.4],
    [T.f7, B.swaps - 0.5],
  ];
  const SAYS = LINES.map(([text, from], i) => {
    const until = (i + 1 < LINES.length ? LINES[i + 1][1] : B.endCard - 0.4) - 0.45;
    return `<div class="a" style="${A('riseSmall', from, 0.7)}">
              <div class="a" style="${A('out', until, 0.4)}">${esc(text)}</div>
            </div>`;
  }).join('');

  document.getElementById('stage').outerHTML = `
    <div id="world"><div id="cam">

      <div class="plane" id="room" data-z="-1150">${LAMPS}<div id="haze"></div></div>

      <div class="plane" id="screen" data-z="-330">
        ${FIGURES}<div id="scan"></div>
        <div id="bar" class="a" style="${A('fade', 0.2, 1.4)}"><i></i><b></b></div>
        <div class="meta l a" style="${A('fade', 0.2, 1.4)}">${esc(T.fep)}</div>
        <div class="meta r a" style="${A('fade', 0.2, 1.4)}">${esc(T.ftotal)}</div>
        <div id="paused" class="a" style="${A('fade', B.pause, 0.5)}"><s></s><s></s> PAUSED</div>
      </div>

      <div class="plane" id="subs" data-z="120">
        <div class="cap a" style="${A('rise', B.lineIn, 1.0)}">${cap(T.s1cap, false)}</div>
      </div>

      <div class="plane" id="dict" data-z="80">
        <div class="a" style="${A('rise', B.dictIn, 0.8)}">
          <div class="a" style="${A('sink', B.dictOut, 0.9)}">
            <span class="lbl">${esc(T.fdict)}</span><span class="val">${esc(T.s2losep)}<u class="a" style="${A('strike', B.strike, 0.5, 'var(--quart)')}"></u></span>
          </div>
        </div>
      </div>

      <div class="plane" id="lifted" data-z="120">
        <div class="a" style="${A('fade', B.held, 0.25)}">
          <div class="a" style="${A('lift', B.held, 1.5)}">
            <div class="cap">${cap(T.s1cap, true)}</div>
          </div>
        </div>
      </div>

      ${NODES}

      <div class="plane" id="card" data-z="150">
        <div class="a" style="${A('landHere', B.answer, 1.1)}">
          <div id="halo" class="a" style="${A('ring', B.answer, 1.5, 'var(--quart)')}"></div>
          <div class="src">${esc(T.s2src.join(''))} &middot; ${esc(T.s2time)}</div>
          <div class="lead" id="lead">${esc(T.s1card)}</div>
          <div class="term">${esc(T.s1word)}</div>
          <div id="chips">${T.s2chips.map((c, i) =>
            `<span class="a" style="${A('chipIn', B.chips + i * 0.13, 0.5)}">${esc(c)}</span>`).join('')}</div>
          <div id="shine" class="a" style="${A('sheen', B.answer + 0.25, 1.5, 'var(--quart)')}"></div>
        </div>
      </div>

      ${DEVS}

      <div class="plane" id="swap" data-z="152">${SWAPS}</div>

    </div></div>

    <canvas id="fx" width="1920" height="1080"></canvas>
    <div id="says">${SAYS}</div>

    <div id="veil"></div>
    <div id="end" class="a" style="${A('fade', B.endCard + 0.35, 1.1)}">
      <div>
        <div id="mark" class="a" style="${A('rise', B.endCard + 0.5, 1.0)}"></div>
        <h2 class="a" style="${A('rise', B.endCard + 0.75, 1.0)}">${esc(T.f8)}</h2>
        <p class="a" style="${A('rise', B.endCard + 1.0, 1.0)}">${esc(T.f9)}</p>
        <small class="a" style="${A('fade', B.endCard + 1.6, 1.0)}">subtitlenotes.com</small>
      </div>
    </div>
`;

  const root = document.documentElement;
  const cam = document.getElementById('cam');
  const veil = document.getElementById('veil');
  const fx = document.getElementById('fx');
  const g = fx.getContext('2d');
  const planes = [...document.querySelectorAll('.plane')];
  const screen = document.getElementById('screen');
  const subs = document.getElementById('subs');
  const dict = document.getElementById('dict');
  const lifted = document.getElementById('lifted');
  const nodes = [...document.querySelectorAll('.node')];
  const card = document.getElementById('card');
  const devs = [...document.querySelectorAll('.dev')];
  const swap = document.getElementById('swap');
  const lead = document.getElementById('lead');
  const chips = document.getElementById('chips');

  /* — the camera, and the projection the canvas shares with it — */
  const F = 1400, CX = 960, CY = 486;
  const ease = (k) => k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);
  const span = (s, from, to) => ease((s - from) / (to - from));
  const mix = (a, b, k) => a + (b - a) * k;

  /* One unbroken move: in towards the subtitle, held while the corridor
     works, then a slow drift out under the end card. The rotation never
     settles, so no frame is ever a still. */
  function camera(s) {
    const z = mix(-120, 40, span(s, 0, B.held))
      + mix(0, 150, span(s, B.away, B.answer))
      - mix(0, 120, span(s, B.devSwell, B.dev + 1.4))
      + mix(0, 90, span(s, B.swaps, STORY_END));
    const ry = mix(-3.4, 1.6, span(s, 0, B.answer)) + mix(0, -2.2, span(s, B.devSwell, STORY_END));
    const rx = mix(2.2, -0.6, span(s, 0, B.pause)) + mix(0, 1.1, span(s, B.devSwell, STORY_END));
    return { z, ry: ry * Math.PI / 180, rx: rx * Math.PI / 180 };
  }

  /** World point -> screen, through the same camera CSS is using. */
  function project(p, c) {
    // Rx, then Ry, then the camera's own translation: the order the CSS
    // transform list below applies them in.
    let { x, y, z } = p;
    let y1 = y * Math.cos(c.rx) - z * Math.sin(c.rx);
    let z1 = y * Math.sin(c.rx) + z * Math.cos(c.rx);
    let x2 = x * Math.cos(c.ry) + z1 * Math.sin(c.ry);
    let z2 = -x * Math.sin(c.ry) + z1 * Math.cos(c.ry);
    z2 += c.z;
    const k = F / (F - z2);
    return { x: CX + x2 * k, y: CY + y1 * k, k, z: z2 };
  }

  /* The corridor, in world coordinates. The motes fly it, and the beams are
     drawn along it, so the picture and the "data" cannot disagree. */
  const PATH = [
    { x: 0, y: 70, z: 120 },        // the phrase, on the subtitle plane
    { x: -380, y: 40, z: -150 },    // the line
    { x: 140, y: -30, z: -350 },    // the sense
    { x: -150, y: -110, z: -560 },  // the dub
    { x: 0, y: -130, z: 150 },      // and back out, into the card
  ];
  const curve = (u) => {
    // Out along the first four points at a steady rate - easing each leg made
    // every mote hesitate at the same node and the stream turned into a clot -
    // then home along the last one, which does get an ease, because that is
    // the leg the eye follows all the way into the card.
    if (u < 0.66) {
      const v = (u / 0.66) * 3, i = Math.min(2, Math.floor(v)), f = v - i;
      const a = PATH[i], b = PATH[i + 1];
      return { x: mix(a.x, b.x, f), y: mix(a.y, b.y, f), z: mix(a.z, b.z, f) };
    }
    const f = (u - 0.66) / 0.34, a = PATH[3], b = PATH[4];
    const q = ease(f);
    return { x: mix(a.x, b.x, q), y: mix(a.y, b.y, q) - Math.sin(f * Math.PI) * 110, z: mix(a.z, b.z, q) };
  };

  const rand = (seed) => () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const GLYPHS = (T.s2src.join('') + T.s1card).replace(/\s+/g, '').split('');
  const MOTES = Array.from({ length: 300 }, (_, i) => {
    const r = rand(i * 2654435761 + 7);
    return {
      lead: r() * 0.86,                       // when this one sets off
      wob: r() * Math.PI * 2, amp: 14 + r() * 46,
      ch: r() < 0.42 ? GLYPHS[Math.floor(r() * GLYPHS.length)] : null,
      size: 17 + r() * 22, hot: r(),
    };
  });

  const GRAIN = Array.from({ length: 1500 }, (_, i) => {
    const r = rand(i * 22695477 + 3);
    return { x: r() * 1920, y: r() * 1080, a: r() };
  });

  function beams(s, c) {
    // The corridor lights up node by node, in step with the three notes.
    for (let i = 0; i < 3; i++) {
      const from = project(PATH[i], c), to = project(PATH[i + 1], c);
      const lit = span(s, [B.away, B.n1, B.n2][i], [B.n1, B.n2, B.n3][i]);
      if (lit <= 0) continue;
      const fade = 1 - span(s, B.back + 0.6, B.devSwell - 1.2);
      if (fade <= 0) continue;
      const grad = g.createLinearGradient(from.x, from.y, to.x, to.y);
      grad.addColorStop(0, 'rgba(70,214,143,0)');
      grad.addColorStop(Math.max(0.02, lit * 0.5), 'rgba(70,214,143,.62)');
      grad.addColorStop(Math.min(1, lit), 'rgba(70,214,143,0)');
      g.strokeStyle = grad;
      g.lineWidth = Math.max(1.6, 4.2 * to.k);
      g.globalAlpha = fade;
      g.beginPath(); g.moveTo(from.x, from.y); g.lineTo(to.x, to.y); g.stroke();
      g.globalAlpha = 1;
    }
  }

  function motes(s, c) {
    const flight = (s - B.away) / (B.answer - B.away);
    if (flight <= -0.05 || flight > 1.7) return;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    for (const m of MOTES) {
      const u = (flight - m.lead * 0.5) / (1 - m.lead * 0.5);
      if (u <= 0 || u >= 1) continue;
      const p = curve(u);
      // A little wander, so a stream reads as many things and not one ribbon.
      const leg = Math.abs(Math.sin(u * Math.PI * 3.03));   // 0 at the waypoints
      const w = Math.sin(u * 7.4 + m.wob) * m.amp * leg;
      const sp = project({
        x: p.x + w,
        y: p.y + Math.cos(u * 5.9 + m.wob) * m.amp * 0.55 * leg,
        z: p.z,
      }, c);
      if (sp.z >= F - 40) continue;
      // Brightest in the middle of the trip, gone as it arrives in the card.
      const a = Math.min(1, u * 6) * Math.min(1, (1 - u) * 5.5) * (0.35 + m.hot * 0.65);
      if (a <= 0.01) continue;
      g.globalAlpha = a * Math.min(1, sp.k * 1.1);
      if (m.ch) {
        g.fillStyle = m.hot > 0.72 ? '#eef3f0' : 'rgba(70,214,143,.92)';
        g.font = `500 ${Math.max(7, m.size * sp.k)}px "Segoe UI", system-ui, sans-serif`;
        g.fillText(m.ch, sp.x, sp.y);
      } else {
        g.fillStyle = 'rgba(70,214,143,.95)';
        const r = Math.max(0.8, 2.4 * sp.k);
        g.beginPath(); g.arc(sp.x, sp.y, r, 0, 6.2832); g.fill();
      }
    }
    g.globalAlpha = 1;
  }

  function flow(s, c) {
    // Four cards crossing between the three devices, on the four soft ticks.
    const k = span(s, B.flow, B.flow + 2.2);
    if (k <= 0 || s > B.swaps + 0.6) return;
    const spots = devs.map((_, i) => ({ x: -560 + i * 560, y: -250, z: -40 }));
    for (let i = 0; i < 4; i++) {
      const u = ease(Math.min(1, Math.max(0, (s - B.flow - i * 0.15) / 1.5)));
      if (u <= 0 || u >= 1) continue;
      const a = spots[i % 3], b = spots[(i + 1) % 3];
      const p = { x: mix(a.x, b.x, u), y: mix(a.y, b.y, u) - Math.sin(u * Math.PI) * 130, z: mix(a.z, b.z, u) + Math.sin(u * Math.PI) * 120 };
      const sp = project(p, c);
      g.globalAlpha = Math.min(1, u * 5) * Math.min(1, (1 - u) * 5) * 0.9;
      g.fillStyle = 'rgba(70,214,143,.9)';
      const w = 46 * sp.k, h = 13 * sp.k;
      g.beginPath();
      g.roundRect(sp.x - w / 2, sp.y - h / 2, w, h, h / 2);
      g.fill();
      g.globalAlpha = 1;
    }
  }

  function atmosphere(s) {
    // A vignette that tightens as the picture dims, and grain over everything.
    const vg = g.createRadialGradient(CX, CY, 620, CX, CY, 1500);
    vg.addColorStop(0, 'rgba(5,8,10,0)');
    vg.addColorStop(1, `rgba(5,8,10,${0.28 + 0.12 * span(s, B.devSwell, STORY_END)})`);
    g.fillStyle = vg;
    g.fillRect(0, 0, 1920, 1080);
    g.fillStyle = '#eef3f0';
    for (const p of GRAIN) {
      g.globalAlpha = 0.005 + p.a * 0.011;
      g.fillRect(p.x, p.y, 1.4, 1.4);
    }
    g.globalAlpha = 1;
  }

  /* Which planes exist when. Keeping them out of the way is what stops the
     corridor from standing behind the end card. */
  const windows = [
    ['#dict', B.dictIn - 0.4, B.dictOut + 1.2],
    ['#lifted', B.held - 0.1, B.away + 0.9],
    ['.node', B.n1 - 0.9, B.devSwell - 0.8],
    ['#card', B.answer - 0.3, B.endCard + 0.4],
    ['.dev', B.dev - 0.9, B.swaps - 0.2],
    ['#swap', B.swaps - 0.3, B.endCard + 0.6],
    ['#subs', 0, B.answer + 0.2],
  ];

  function seek(time) {
    const s = time / RATE;
    root.style.setProperty('--t', time);

    const c = camera(s);
    cam.style.transform =
      `translate3d(0,0,${c.z.toFixed(2)}px) rotateY(${(c.ry * 180 / Math.PI).toFixed(3)}deg)`
      + ` rotateX(${(c.rx * 180 / Math.PI).toFixed(3)}deg)`;

    // Each plane sits at its own depth, and blurs as it gets far from the
    // camera - the cheapest honest depth cue there is.
    for (const el of planes) {
      const z = el.dataset.at !== undefined ? NODE_AT[Number(el.dataset.at)][2]
        : el.dataset.dev !== undefined ? -40
        : Number(el.dataset.z || 0);
      const dist = Math.abs(z + c.z);
      const blur = Math.min(4, Math.max(0, (dist - 560) / 260));
      el.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';
    }
    // The dev planes fan out in 3D rather than sitting in a row.
    devs.forEach((el, i) => {
      el.style.transform = `translate3d(${-560 + i * 560}px, -250px, -40px)`
        + ` rotateY(${(-24 + i * 24).toFixed(1)}deg)`;
    });
    nodes.forEach((el, i) => {
      const [x, y, z] = NODE_AT[i];
      el.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
    });

    for (const [sel, from, to] of windows) {
      for (const el of document.querySelectorAll(sel)) {
        el.style.visibility = s >= from - 0.02 && s <= to ? 'visible' : 'hidden';
      }
    }

    // The picture stays where it is and dims - it is the same room all the
    // way through, not a rectangle that gets cropped away.
    const dim = span(s, B.pause, B.pause + 1.2) * 0.34 + span(s, B.devSwell, B.devSwell + 1.1) * 0.3;
    screen.style.opacity = String(Math.max(0.32, 1 - dim));
    subs.style.opacity = String(1 - span(s, B.back, B.answer));
    // Forward for the answer, back to sit behind the three surfaces as the
    // library they share, forward again for the languages.
    const back = span(s, B.devSwell, B.dev + 0.6) * (1 - span(s, B.swaps - 1.1, B.swaps));
    card.style.transform = `translate3d(0, ${(back * 150).toFixed(1)}px, ${(150 - back * 470).toFixed(1)}px)`;
    card.style.opacity = String((1 - 0.55 * back) * (1 - span(s, B.endCard - 0.6, B.endCard + 0.2)));
    lead.style.opacity = String(1 - span(s, B.swaps - 0.5, B.swaps + 0.1));
    chips.style.opacity = String(1 - span(s, B.swaps - 0.5, B.swaps + 0.1));
    swap.style.opacity = String(1 - span(s, B.endCard - 0.5, B.endCard + 0.3));
    veil.style.opacity = String(0.86 * span(s, B.endCard - 0.4, B.endCard + 0.5));

    g.clearRect(0, 0, 1920, 1080);
    beams(s, c);
    motes(s, c);
    flow(s, c);
    atmosphere(s);
  }

  window.FILM = { seek, duration: +(STORY_END * RATE).toFixed(3), rate: RATE };
  const at = q.get('t');
  if (at !== null) {
    seek(Number(at));
    document.fonts.ready.then(() => { document.documentElement.dataset.ready = '1'; });
  } else {
    const t0 = performance.now();
    const tick = () => {
      seek(((performance.now() - t0) / 1000) % window.FILM.duration);
      requestAnimationFrame(tick);
    };
    tick();
  }
})();
</script>
