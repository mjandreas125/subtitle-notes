<!doctype html>
<meta charset="utf-8">
<title>Subtitle Notes - Play feature graphic</title>
<!--
  The 1024x500 feature graphic Google Play puts at the top of a listing.

      play-banner.html?lang=ru

  Play draws its own play button and title over parts of this image on some
  surfaces, and crops it on others, so everything that has to be read lives in
  the left two thirds and well inside the edges. The right side is the film
  frame doing the arguing: a subtitle with one phrase lit, and the answer.
-->
<script src="strings.js"></script>
<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: #05080a;
    font: 400 16px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #eef3f0; -webkit-font-smoothing: antialiased; position: relative;
  }
  /* The room's light, coming from where the picture is. */
  #wash {
    position: absolute; inset: 0;
    background:
      radial-gradient(58% 90% at 76% 42%, rgba(70, 214, 143, .20), rgba(5, 8, 10, 0) 68%),
      radial-gradient(46% 70% at 12% 18%, rgba(150, 186, 206, .10), rgba(5, 8, 10, 0) 70%);
  }
  #grain { position: absolute; inset: 0; opacity: .5; }

  #mark {
    position: absolute; left: 64px; top: 74px;
    width: 74px; height: 56px; border-radius: 15px; background: #46d68f;
    box-shadow: 0 0 70px -10px rgba(70, 214, 143, .6);
  }
  #mark::before, #mark::after {
    content: ''; position: absolute; height: 8px; border-radius: 4px; background: #06231a;
  }
  #mark::before { top: 16px; left: 14px; right: 14px; }
  #mark::after { bottom: 16px; left: 14px; width: 20px; }

  h1 {
    position: absolute; left: 64px; top: 156px; margin: 0;
    font-size: 54px; font-weight: 750; letter-spacing: -.03em; line-height: 1;
  }
  p {
    position: absolute; left: 64px; top: 226px; margin: 0; width: 430px;
    font-size: 23px; line-height: 1.42; color: #9fb0a8;
  }
  #store {
    position: absolute; left: 64px; bottom: 62px;
    font-size: 17px; letter-spacing: .16em; text-transform: uppercase; color: #6d7f77;
  }

  /* The picture, held at an angle so the banner has a direction. */
  #frame {
    position: absolute; right: 26px; top: 50%; width: 520px; height: 294px;
    margin-top: -147px; border-radius: 14px; overflow: hidden;
    transform: perspective(1400px) rotateY(-11deg) rotateX(2deg);
    box-shadow: 0 50px 110px -40px rgba(0, 0, 0, .95);
    background: linear-gradient(160deg, #16232b, #070c0e 62%);
  }
  #win {
    position: absolute; left: 8%; top: 8%; width: 27%; height: 54%;
    background: linear-gradient(150deg, rgba(176, 205, 222, .55), rgba(96, 136, 158, .1));
    box-shadow: inset 0 0 0 6px rgba(5, 9, 11, .9), 0 0 90px 20px rgba(140, 175, 200, .16);
    filter: blur(1.5px);
  }
  #lamp {
    position: absolute; right: 12%; top: 26%; width: 250px; height: 250px;
    margin: -125px -125px 0 0; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 214, 150, .95), rgba(255, 190, 120, .28) 14%, rgba(255, 180, 100, 0) 62%);
  }
  #person {
    position: absolute; left: 44%; bottom: -16%; width: 168px; height: 226px;
    border-radius: 50% 50% 42% 42%; background: #070c0e;
    box-shadow: 6px -8px 0 -6px rgba(255, 206, 148, .5);
  }
  #bars { position: absolute; left: 0; right: 0; height: 26px; background: #040708; }
  #bars.b { bottom: 0; } #bars.t { top: 0; }
  #cap {
    position: absolute; left: 6%; right: 6%; bottom: 22%;
    padding: 12px 16px; border-radius: 8px; background: rgba(5, 8, 10, .84);
    font-size: 22px; font-weight: 600; text-align: center; white-space: nowrap;
  }
  #cap em { font-style: normal; background: #46d68f; color: #06231a; border-radius: 4px; padding: 1px 5px; }
  #answer {
    position: absolute; left: 8%; right: 8%; bottom: 5%; padding: 10px 14px; text-align: center;
    border-radius: 10px; background: rgba(9, 20, 17, .96);
    border: 1px solid rgba(70, 214, 143, .5);
    font-size: 19px; font-weight: 600; white-space: nowrap; overflow: hidden;
    box-shadow: 0 24px 50px -20px rgba(0, 0, 0, .9);
  }
  #answer b { color: #46d68f; font-weight: 600; }
</style>

<div id="wash"></div>
<div id="mark"></div>
<h1>Subtitle Notes</h1>
<p id="lede"></p>
<div id="store"></div>

<div id="frame">
  <div id="win"></div>
  <div id="lamp"></div>
  <div id="person"></div>
  <div id="bars" class="t"></div>
  <div id="bars" class="b"></div>
  <div id="cap"></div>
  <div id="answer"></div>
</div>
<canvas id="grain" width="1024" height="500"></canvas>

<script>
(function () {
  var lang = new URLSearchParams(location.search).get('lang') || 'en';
  var T = window.STRINGS[lang] || window.STRINGS.en;
  // Every string here already exists in the film and the store listing.
  document.getElementById('lede').textContent = T.f4;
  document.getElementById('store').textContent = 'subtitlenotes.com';
  var cap = document.getElementById('cap');
  cap.innerHTML = '';
  T.s1cap.forEach(function (part, i) {
    var node = i === 1 ? document.createElement('em') : document.createTextNode(part);
    if (i === 1) { node.textContent = part; }
    cap.appendChild(node);
  });
  document.getElementById('answer').innerHTML =
    '<b>' + T.s1card + '</b>';

  var g = document.getElementById('grain').getContext('2d');
  for (var i = 0; i < 2600; i++) {
    g.fillStyle = 'rgba(255,255,255,' + (0.006 + (i % 5) * 0.004) + ')';
    g.fillRect((i * 6151) % 1024, (i * 2749) % 500, 1.2, 1.2);
  }
})();
</script>
