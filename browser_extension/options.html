<!doctype html>
<html><head><meta charset="utf-8"><title>Subtitle Notes</title><style>body{font:15px system-ui;background:#101416;color:#eef7f2;max-width:560px;margin:42px auto;padding:0 22px}input{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 16px;background:#1b252b;border:1px solid #30413e;border-radius:10px;color:white}button{padding:11px 15px;border:0;border-radius:10px;background:#9be8cf;color:#101416;font-weight:700;cursor:pointer}#message{min-height:22px;color:#9be8cf}.code{font-size:30px;font-weight:800;letter-spacing:4px;color:#9be8cf;min-height:38px}</style></head><body><h1>Subtitle Notes Capture</h1><p>Select text on any website, right-click it, then choose <b>Send to Subtitle Notes</b>.</p><p>Connect this browser to the Google account already signed in on your phone. No password is used.</p><label>Server address</label><input id="apiUrl" placeholder="https://your-server.example/v1"><button id="connect">Connect this browser</button><p class="code" id="code"></p><p id="message"></p><script src="options.js"></script></body></html>
