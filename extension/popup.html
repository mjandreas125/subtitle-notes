<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --paper: #fbfcf9; --raised: #ffffff; --ink: #13231c; --muted: #66776f;
        --line: #dce6df; --accent: #168653; --accent-deep: #0f6940; --wash: #ebf7ef;
        --shadow: 0 12px 30px rgba(16, 47, 31, .12), 0 2px 5px rgba(16, 47, 31, .06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #111a16; --raised: #19241e; --ink: #f2f8f4; --muted: #a6b7ad;
          --line: #2c3d34; --accent: #58cf94; --accent-deep: #79e1aa; --wash: #1c3126;
          --shadow: 0 14px 30px rgba(0, 0, 0, .27), 0 2px 5px rgba(0, 0, 0, .16);
        }
      }
      * { box-sizing: border-box; }
      body { visibility: hidden; }
      body.ready { visibility: visible; }
      body {
        width: 340px; margin: 0; padding: 18px; background: var(--paper); color: var(--ink);
        font-family: "Segoe UI Variable Text", "Segoe UI", Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 14px; line-height: 1.35; -webkit-font-smoothing: antialiased;
      }
      [hidden] { display: none !important; }
      .top { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; }
      .mark {
        width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center;
        color: #fff; background: linear-gradient(145deg, #27a96d, #087040);
        box-shadow: 0 6px 14px rgba(22, 134, 83, .25);
      }
      .mark svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; }
      h1 { margin: 0; font-size: 16px; line-height: 1; font-weight: 780; letter-spacing: -.025em; }
      #state { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; font-weight: 560; line-height: 1.45; }
      #connect {
        width: 100%; min-height: 52px; margin-bottom: 12px; border: 0; border-radius: 14px; cursor: pointer;
        background: linear-gradient(135deg, #20a765, #087442); color: #fff; box-shadow: 0 9px 18px rgba(17, 132, 78, .22);
        font-family: inherit; font-size: 14px; font-weight: 760; line-height: 1; letter-spacing: -.01em;
        transition: filter .15s ease, transform .1s ease;
      }
      #connect:hover { filter: brightness(1.06); }
      #connect:active { transform: scale(.985); }
      .foot { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
      .action {
        position: relative; min-height: 56px; display: flex; align-items: center; gap: 9px; min-width: 0; padding: 9px 10px;
        border: 1px solid var(--line); border-radius: 14px; cursor: pointer; text-align: left; color: var(--ink); background: var(--raised);
        box-shadow: 0 3px 8px rgba(17, 43, 28, .035); font-family: inherit; font-size: 12.5px; font-weight: 740; line-height: 1.15; letter-spacing: -.012em;
        /* Colour and press only. A button that moves on hover slides its own
           edge out from under the cursor and flickers there. */
        transition: background-color .15s ease, border-color .15s ease, transform .1s ease;
      }
      /* The lift is a layer that fades in, not a shadow being re-blurred on
         every frame. */
      .action::after {
        content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        box-shadow: var(--shadow); opacity: 0; transition: opacity .16s ease;
      }
      .action:hover::after { opacity: 1; }
      .action:hover { border-color: #a9d4ba; background: var(--wash); }
      .action:active { transform: scale(.985); }
      .action:active::after { opacity: 0; }
      button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent); outline-offset: 2px; }
      .action.primary {
        grid-column: 1 / -1; min-height: 60px; border-color: transparent; color: #fff;
        background: linear-gradient(135deg, #1ca461, #087141); box-shadow: 0 10px 20px rgba(15, 120, 69, .24);
        transition: filter .15s ease, transform .1s ease;
      }
      .action.primary:hover { filter: brightness(1.06); border-color: transparent; }
      .action.primary::after { display: none; }
      .action-icon { width: 31px; height: 31px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 10px; color: var(--accent); background: var(--wash); }
      .action.primary .action-icon { color: #fff; background: rgba(255, 255, 255, .16); }
      .action-icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .action-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .action-arrow { margin-left: auto; color: var(--muted); font-size: 18px; font-weight: 500; line-height: 1; }
      .action.primary .action-arrow { color: rgba(255, 255, 255, .82); }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 5.5h9.5a2.5 2.5 0 0 1 2.5 2.5v10H8.5A2.5 2.5 0 0 0 6 20.5z"/><path d="M6 5.5v15"/><path d="M9.5 10h5"/></svg></div>
      <h1 id="title">Subtitle Notes</h1>
    </div>
    <p id="state"></p>
    <button id="connect" hidden></button>
    <div class="foot">
      <button class="action primary" id="library" hidden>
        <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5A2.5 2.5 0 0 1 20 21z"/></svg></span>
        <span class="action-label"></span><span class="action-arrow" aria-hidden="true">→</span>
      </button>
      <button class="action" id="export" hidden>
        <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v11"/><path d="m8 10 4 4 4-4"/><path d="M5 15.5V20h14v-4.5"/></svg></span>
        <span class="action-label"></span>
      </button>
      <button class="action" id="settings">
        <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.1 2.1-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56v.1h-3v-.1A1.7 1.7 0 0 0 10.7 18.64a1.7 1.7 0 0 0-1.88.34l-.06.06-2.1-2.1.06-.06A1.7 1.7 0 0 0 7.06 15 1.7 1.7 0 0 0 5.5 14H5.4v-3h.1A1.7 1.7 0 0 0 7.06 10a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.1-2.1.06.06A1.7 1.7 0 0 0 10.7 6.36a1.7 1.7 0 0 0 1.03-1.56V4.7h3v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.1 2.1-.06.06A1.7 1.7 0 0 0 19.4 10a1.7 1.7 0 0 0 1.56 1h.1v3h-.1A1.7 1.7 0 0 0 19.4 15z"/></svg></span>
        <span class="action-label"></span>
      </button>
    </div>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
